<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Signed Out</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #6b7280, #1f2937);
      height: 100vh;
      display: flex; justify-content: center; align-items: center;
      color: #333;
    }

    .box {
      background: white; padding: 40px; border-radius: 16px;
      text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 400px; width: 90%;
    }

    .icon { font-size: 60px; margin-bottom: 10px; }
    h1 { margin: 10px 0; color: #111; }
    p  { color: #555; margin-bottom: 25px; }

    .btn {
      text-decoration: none; background: #374151; color: white;
      padding: 12px 25px; border-radius: 8px; font-weight: 600;
      transition: background 0.3s;
    }

    .btn:hover { background: #111827; }
  </style>
  <script>
    sessionStorage.clear();
    localStorage.removeItem('autoRefreshInterval');
    history.pushState(null, null, location.href);
    window.onpopstate = function() { history.go(1); };
    window.addEventListener("pageshow", function(e) { if (e.persisted) window.location.reload(); });
  </script>
</head>
<body>
  <div class="box">
    <div class="icon">👋</div>
    <h1>You are signed out</h1>
    <p>Your session has ended successfully.</p>
    <a class="btn" href="/autopilot/login">Sign In Again</a>
  </div>
</body>
</html>
