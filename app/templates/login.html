<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoPilot — Sign In</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:           #0f172a;
      --surface:      #1e293b;
      --border:       #334155;
      --text:         #f1f5f9;
      --muted:        #94a3b8;
      --accent:       #7c3aed;
      --accent-hover: #6d28d9;
      --accent-text:  #a78bfa;
      --input-bg:     #0f172a;
      --error-bg:     rgba(239,68,68,0.1);
      --error-border: rgba(239,68,68,0.3);
    }

    [data-theme="light"] {
      --bg:           #f8fafc;
      --surface:      #ffffff;
      --border:       #e2e8f0;
      --text:         #0f172a;
      --muted:        #64748b;
      --input-bg:     #f8fafc;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    body { display: flex; flex-direction: column; }

    .theme-btn {
      position: fixed; top: 16px; right: 16px;
      width: 32px; height: 32px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); transition: color 0.2s, background 0.2s;
      overflow: hidden; position: fixed; z-index: 10;
    }

    .theme-btn:hover { color: var(--text); background: var(--border); }

    .theme-btn .icon-sun, .theme-btn .icon-moon {
      position: absolute; width: 15px; height: 15px;
      transition: opacity 0.3s, transform 0.3s;
    }

    [data-theme="dark"]  .theme-btn .icon-sun  { opacity: 0; transform: rotate(90deg); }
    [data-theme="dark"]  .theme-btn .icon-moon { opacity: 1; transform: rotate(0);    }
    [data-theme="light"] .theme-btn .icon-sun  { opacity: 1; transform: rotate(0);    color: #f59e0b; }
    [data-theme="light"] .theme-btn .icon-moon { opacity: 0; transform: rotate(-90deg); }

    main {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%; max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      animation: fadein 0.4s ease;
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 6px;
    }

    .brand-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: white; flex-shrink: 0;
    }

    .brand-icon svg { width: 18px; height: 18px; }

    .brand-name {
      font-size: 1.3rem; font-weight: 700;
      letter-spacing: -0.4px; color: var(--text);
    }

    .tagline { font-size: 0.82rem; color: var(--muted); margin-bottom: 28px; }

    label {
      display: block; font-size: 0.72rem; font-weight: 600;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.07em; margin-bottom: 5px;
    }

    .field { margin-bottom: 14px; }

    input[type="text"], input[type="password"] {
      width: 100%; padding: 9px 12px;
      background: var(--input-bg);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 0.88rem; font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--accent); }

    .error {
      font-size: 0.78rem; color: #f87171;
      background: var(--error-bg); border: 1px solid var(--error-border);
      border-radius: 7px; padding: 8px 11px;
      margin-bottom: 14px;
    }

    .submit {
      width: 100%; padding: 10px;
      background: var(--accent); border: none; border-radius: 8px;
      color: white; font-size: 0.9rem; font-weight: 600;
      font-family: inherit; cursor: pointer; margin-top: 4px;
      transition: background 0.2s, transform 0.15s;
    }

    .submit:hover { background: var(--accent-hover); transform: scale(1.01); }

    footer {
      padding: 14px; text-align: center;
      font-size: 11px; color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
  </style>
</head>
<body>

  <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
      <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/>
      <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
      <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
      <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/>
      <line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
    </svg>
  </button>

  <main>
    <div class="card">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06
                     a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
                     A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83
                     l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
                     A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83
                     l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
                     a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83
                     l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
                     a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </div>
        <span class="brand-name">AutoPilot</span>
      </div>
      <p class="tagline">Sign in to manage your scheduled jobs</p>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/autopilot/login">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username"
                 autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="submit">Sign In</button>
      </form>
    </div>
  </main>

  <footer>© 2026 Vinay Singh</footer>

  <script>
    const t = localStorage.getItem("ap-theme") || "dark";
    document.documentElement.setAttribute("data-theme", t);
    function toggleTheme() {
      const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("ap-theme", next);
    }
  </script>
</body>
</html>
